# Render blueprint for the KazeSU Telegram companion bot.
#
# Deploy: https://render.com/deploy?repo=https://github.com/KazeSU/telegram-bot
# Then set TELEGRAM_BOT_TOKEN in the dashboard (it is marked sync: false, so it
# is never stored in this file). WEBHOOK_SECRET is generated by Render.
#
# Webhook mode is used instead of long polling because Render's free instance
# sleeps when idle and only wakes on an inbound HTTP request.
services:
  - type: web
    name: kazesu-bot
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: WEBHOOK_URL
        fromService:
          type: web
          name: kazesu-bot
          envVarKey: RENDER_EXTERNAL_URL
      - key: GITHUB_TOKEN
        sync: false
      - key: KAZESU_REPO
        value: KazeSU/KazeSU
      - key: KAZESU_SITE_REPO
        value: KazeSU/KazeSU.github.io
      - key: KAZESU_WEBSITE
        value: https://kazesu.github.io
      - key: KAZESU_TELEGRAM_URL
        value: https://t.me/KazeKSU
      - key: LOG_LEVEL
        value: INFO
